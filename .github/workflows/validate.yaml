name: Validate FaroDocs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm run build
        working-directory: web

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17-trixie
        env:
          POSTGRES_DB: farodocs
          POSTGRES_USER: farodocs
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U farodocs -d farodocs"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://farodocs:ci-only@127.0.0.1:5432/farodocs
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install -e backend
      - run: python -c "from farodocs.main import app, health; from farodocs.worker import celery_app; assert health() == {'status':'ok'}; assert app.title == 'FaroDocs API'; assert celery_app.main == 'farodocs'"
      - name: Check synthetic parser and upload fixtures
        run: |
          python -m pip install reportlab==4.4.4
          PYTHONPATH=backend:backend/tests python -m unittest backend.tests.test_extraction backend.tests.test_uploads backend.tests.test_groq -v
      - run: python -m farodocs.migrate
      - run: python -m farodocs.migrate
      - name: Check processing and conversations against PostgreSQL
        env:
          PYTHONPATH: backend:backend/tests
        run: python -m unittest backend.tests.test_processing backend.tests.test_conversations -v
      - name: Check database constraints
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import psycopg

          with psycopg.connect(os.environ["DATABASE_URL"]) as connection:
              with connection.cursor() as cursor:
                  cursor.execute(Path("backend/tests/schema_constraints.sql").read_text(encoding="utf-8-sig"))
                  cursor.execute("SELECT extversion FROM pg_extension WHERE extname = 'vector'")
                  assert cursor.fetchone()[0] == "0.8.7"
                  cursor.execute("SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public'")
                  assert cursor.fetchone()[0] == 15
          PY

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker compose config --quiet

  library-http:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install -e backend reportlab==4.4.4
      - run: docker compose up --build -d --wait
      - name: Check synthetic library and search through HTTP
        env:
          PYTHONPATH: backend:backend/tests
          FARODOCS_TEST_API_URL: http://127.0.0.1:8000
        run: python -m unittest backend.tests.test_api_library backend.tests.test_api_search -v
      - if: always()
        run: docker compose down
