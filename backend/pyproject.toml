[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "farodocs-backend"
version = "0.1.0"
description = "FaroDocs application API and document worker"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.165.0",
  "uvicorn==0.40.0",
  "celery[redis]==5.6.3",
  "psycopg[binary]==3.3.2",
]

[tool.setuptools.packages.find]
include = ["farodocs*"]
