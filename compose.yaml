name: farodocs

services:
  db:
    restart: unless-stopped
    image: pgvector/pgvector:0.8.7-pg17-trixie
    environment:
      POSTGRES_DB: farodocs
      POSTGRES_USER: farodocs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U farodocs -d farodocs"]
      interval: 5s
      timeout: 3s
      retries: 12

  broker:
    restart: unless-stopped
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - broker_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    restart: unless-stopped
    build: ./backend
    command: ["sh", "-c", "python -m farodocs.migrate && uvicorn farodocs.main:app --host 0.0.0.0 --port 8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://farodocs:${POSTGRES_PASSWORD:-local-development-only}@db:5432/farodocs
      CELERY_BROKER_URL: redis://broker:6379/0
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12

  worker:
    restart: unless-stopped
    build: ./backend
    command: ["celery", "-A", "farodocs.worker:celery_app", "worker", "--loglevel=INFO"]
    environment:
      DATABASE_URL: postgresql+psycopg://farodocs:${POSTGRES_PASSWORD:-local-development-only}@db:5432/farodocs
      CELERY_BROKER_URL: redis://broker:6379/0
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    restart: unless-stopped
    build: ./web
    environment:
      FARODOCS_API_URL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres_data:
  broker_data:
