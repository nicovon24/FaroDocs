<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="access-and-deletion-title access-and-deletion-desc" id="access-and-deletion-root">
<title id="access-and-deletion-title">Access and deletion cross every data path</title>
<desc id="access-and-deletion-desc">Proposed access path: session, document grants, scoped read endpoints, source preview. Proposed deletion path: request, tombstone, cleanup job, audit event. Cleanup covers originals, extracted passages, vectors, and previews.</desc>
<defs>
<marker id="access-and-deletion-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M 0 0 L 10 4 L 0 8" fill="none" stroke="#526176" stroke-width="1.4"/></marker>
<marker id="access-and-deletion-arrow-accent" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M 0 0 L 10 4 L 0 8" fill="none" stroke="#A84128" stroke-width="1.4"/></marker>
</defs>
<rect x="0" y="0" width="1280" height="720" fill="#F7F3EA"/>
<text x="64" y="51" fill="#A84128" font-family="ui-monospace, Consolas, monospace" font-size="12" letter-spacing="2">FARODOCS / 04 / TRUST + LIFECYCLE</text>
<text x="64" y="97" fill="#17263D" font-family="Georgia, serif" font-size="38">Access and deletion cross every data path</text>
<text x="64" y="128" fill="#526176" font-family="system-ui, sans-serif" font-size="15">The backend checks visibility on reads and hides documents before cleanup runs.</text>
<line x1="64" y1="151" x2="1216" y2="151" stroke="#C9D0D5"/>
<path d="M 264 254 L 304 254" fill="none" stroke="#526176" stroke-width="2" marker-end="url(#access-and-deletion-arrow)"/>
<path d="M 504 254 L 544 254" fill="none" stroke="#A84128" stroke-width="2" marker-end="url(#access-and-deletion-arrow-accent)"/>
<path d="M 744 254 L 784 254" fill="none" stroke="#526176" stroke-width="2" marker-end="url(#access-and-deletion-arrow)"/>
<path d="M 264 470 L 304 470" fill="none" stroke="#526176" stroke-width="2" marker-end="url(#access-and-deletion-arrow)"/>
<path d="M 504 470 L 544 470" fill="none" stroke="#526176" stroke-width="2" marker-end="url(#access-and-deletion-arrow)"/>
<path d="M 744 470 L 784 470" fill="none" stroke="#526176" stroke-width="2" marker-end="url(#access-and-deletion-arrow)"/>
<g data-node="session"><rect x="64" y="206" width="200" height="96" rx="8" fill="#FFFEFB" stroke="#C9D0D5" stroke-width="1.5"/><text x="82" y="230" fill="#526176" font-family="ui-monospace, Consolas, monospace" font-size="10" letter-spacing="1.5">STEP</text><text x="82" y="259" fill="#17263D" font-family="system-ui, sans-serif" font-size="18" font-weight="650">Session</text><text x="82" y="281" fill="#526176" font-family="system-ui, sans-serif" font-size="12">identity + workspace</text></g>
<g data-node="grants"><rect x="304" y="206" width="200" height="96" rx="8" fill="#F3DFD6" stroke="#A84128" stroke-width="1.5"/><text x="322" y="230" fill="#526176" font-family="ui-monospace, Consolas, monospace" font-size="10" letter-spacing="1.5">PROCESS</text><text x="322" y="259" fill="#17263D" font-family="system-ui, sans-serif" font-size="18" font-weight="650">Document grants</text><text x="322" y="281" fill="#526176" font-family="system-ui, sans-serif" font-size="12">FastAPI decision</text></g>
<g data-node="read"><rect x="544" y="206" width="200" height="96" rx="8" fill="#FFFEFB" stroke="#C9D0D5" stroke-width="1.5"/><text x="562" y="230" fill="#526176" font-family="ui-monospace, Consolas, monospace" font-size="10" letter-spacing="1.5">STEP</text><text x="562" y="259" fill="#17263D" font-family="system-ui, sans-serif" font-size="18" font-weight="650">Scoped reads</text><text x="562" y="281" fill="#526176" font-family="system-ui, sans-serif" font-size="12">library · search · chat</text></g>
<g data-node="preview"><rect x="784" y="206" width="200" height="96" rx="8" fill="#E9EFF1" stroke="#C9D0D5" stroke-width="1.5"/><text x="802" y="230" fill="#526176" font-family="ui-monospace, Consolas, monospace" font-size="10" letter-spacing="1.5">DATA</text><text x="802" y="259" fill="#17263D" font-family="system-ui, sans-serif" font-size="18" font-weight="650">Source preview</text><text x="802" y="281" fill="#526176" font-family="system-ui, sans-serif" font-size="12">recheck on open</text></g>
<g data-node="delete"><rect x="64" y="422" width="200" height="96" rx="8" fill="#FFFEFB" stroke="#C9D0D5" stroke-width="1.5"/><text x="82" y="446" fill="#526176" font-family="ui-monospace, Consolas, monospace" font-size="10" letter-spacing="1.5">STEP</text><text x="82" y="475" fill="#17263D" font-family="system-ui, sans-serif" font-size="18" font-weight="650">Delete request</text><text x="82" y="497" fill="#526176" font-family="system-ui, sans-serif" font-size="12">owner confirmation</text></g>
<g data-node="tombstone"><rect x="304" y="422" width="200" height="96" rx="8" fill="#FFFEFB" stroke="#C9D0D5" stroke-width="1.5"/><text x="322" y="446" fill="#526176" font-family="ui-monospace, Consolas, monospace" font-size="10" letter-spacing="1.5">STEP</text><text x="322" y="475" fill="#17263D" font-family="system-ui, sans-serif" font-size="18" font-weight="650">Tombstone</text><text x="322" y="497" fill="#526176" font-family="system-ui, sans-serif" font-size="12">hide immediately</text></g>
<g data-node="cleanup"><rect x="544" y="422" width="200" height="96" rx="8" fill="#FFFEFB" stroke="#C9D0D5" stroke-width="1.5"/><text x="562" y="446" fill="#526176" font-family="ui-monospace, Consolas, monospace" font-size="10" letter-spacing="1.5">STEP</text><text x="562" y="475" fill="#17263D" font-family="system-ui, sans-serif" font-size="18" font-weight="650">Cleanup job</text><text x="562" y="497" fill="#526176" font-family="system-ui, sans-serif" font-size="12">files + derived data</text></g>
<g data-node="audit"><rect x="784" y="422" width="200" height="96" rx="8" fill="#E9EFF1" stroke="#C9D0D5" stroke-width="1.5"/><text x="802" y="446" fill="#526176" font-family="ui-monospace, Consolas, monospace" font-size="10" letter-spacing="1.5">DATA</text><text x="802" y="475" fill="#17263D" font-family="system-ui, sans-serif" font-size="18" font-weight="650">Audit event</text><text x="802" y="497" fill="#526176" font-family="system-ui, sans-serif" font-size="12">outcome, no content</text></g>
<line x1="64" y1="618" x2="1216" y2="618" stroke="#C9D0D5"/>
<text x="64" y="651" fill="#526176" font-family="system-ui, sans-serif" font-size="14">Public readiness depends on two-user isolation, full deletion, limits, privacy, and adversarial tests.</text>
<text x="1216" y="651" text-anchor="end" fill="#A84128" font-family="ui-monospace, Consolas, monospace" font-size="11" letter-spacing="1.2">PROPOSED SYSTEM</text>
</svg>
