<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="answer-path-title answer-path-desc" id="answer-path-root">
<title id="answer-path-title">An answer must carry inspectable evidence</title>
<desc id="answer-path-desc">Proposed question path: question, authorized document scope, hybrid lexical and vector search, evidence threshold, bounded context to a model, citation ID validation, cited answer or abstention. Source passages can be opened in their original version.</desc>
<defs>
<marker id="answer-path-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M 0 0 L 10 4 L 0 8" fill="none" stroke="#526176" stroke-width="1.4"/></marker>
<marker id="answer-path-arrow-accent" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M 0 0 L 10 4 L 0 8" fill="none" stroke="#A84128" stroke-width="1.4"/></marker>
</defs>
<rect x="0" y="0" width="1280" height="720" fill="#F7F3EA"/>
<text x="64" y="51" fill="#A84128" font-family="ui-monospace, Consolas, monospace" font-size="12" letter-spacing="2">FARODOCS / 03 / QUESTION PATH</text>
<text x="64" y="97" fill="#17263D" font-family="Georgia, serif" font-size="38">An answer must carry inspectable evidence</text>
<text x="64" y="128" fill="#526176" font-family="system-ui, sans-serif" font-size="15">Authorization comes before retrieval; insufficient evidence ends in an explicit abstention.</text>
<line x1="64" y1="151" x2="1216" y2="151" stroke="#C9D0D5"/>
<path d="M 264 254 L 304 254" fill="none" stroke="#526176" stroke-width="2" marker-end="url(#answer-path-arrow)"/>
<path d="M 504 254 L 544 254" fill="none" stroke="#A84128" stroke-width="2" marker-end="url(#answer-path-arrow-accent)"/>
<path d="M 744 254 L 784 254" fill="none" stroke="#526176" stroke-width="2" marker-end="url(#answer-path-arrow)"/>
<path d="M 884 302 L 884 422" fill="none" stroke="#526176" stroke-width="2" marker-end="url(#answer-path-arrow)"/>
<path d="M 984 254 L 1124 254 L 1124 422" fill="none" stroke="#526176" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#answer-path-arrow)"/>
<path d="M 784 470 L 744 470" fill="none" stroke="#526176" stroke-width="2" marker-end="url(#answer-path-arrow)"/>
<path d="M 544 470 L 504 470" fill="none" stroke="#526176" stroke-width="2" marker-end="url(#answer-path-arrow)"/>
<g data-node="question"><rect x="64" y="206" width="200" height="96" rx="8" fill="#FFFEFB" stroke="#C9D0D5" stroke-width="1.5"/><text x="82" y="230" fill="#526176" font-family="ui-monospace, Consolas, monospace" font-size="10" letter-spacing="1.5">STEP</text><text x="82" y="259" fill="#17263D" font-family="system-ui, sans-serif" font-size="18" font-weight="650">Question</text><text x="82" y="281" fill="#526176" font-family="system-ui, sans-serif" font-size="12">Spanish or English</text></g>
<g data-node="scope"><rect x="304" y="206" width="200" height="96" rx="8" fill="#F3DFD6" stroke="#A84128" stroke-width="1.5"/><text x="322" y="230" fill="#526176" font-family="ui-monospace, Consolas, monospace" font-size="10" letter-spacing="1.5">PROCESS</text><text x="322" y="259" fill="#17263D" font-family="system-ui, sans-serif" font-size="18" font-weight="650">Access scope</text><text x="322" y="281" fill="#526176" font-family="system-ui, sans-serif" font-size="12">allowed versions only</text></g>
<g data-node="retrieve"><rect x="544" y="206" width="200" height="96" rx="8" fill="#FFFEFB" stroke="#C9D0D5" stroke-width="1.5"/><text x="562" y="230" fill="#526176" font-family="ui-monospace, Consolas, monospace" font-size="10" letter-spacing="1.5">STEP</text><text x="562" y="259" fill="#17263D" font-family="system-ui, sans-serif" font-size="18" font-weight="650">Hybrid search</text><text x="562" y="281" fill="#526176" font-family="system-ui, sans-serif" font-size="12">full text + vector</text></g>
<g data-node="evidence"><rect x="784" y="206" width="200" height="96" rx="8" fill="#FFFEFB" stroke="#C9D0D5" stroke-width="1.5"/><text x="802" y="230" fill="#526176" font-family="ui-monospace, Consolas, monospace" font-size="10" letter-spacing="1.5">STEP</text><text x="802" y="259" fill="#17263D" font-family="system-ui, sans-serif" font-size="18" font-weight="650">Evidence gate</text><text x="802" y="281" fill="#526176" font-family="system-ui, sans-serif" font-size="12">passages sufficient?</text></g>
<g data-node="generate"><rect x="784" y="422" width="200" height="96" rx="8" fill="#FFFEFB" stroke="#C9D0D5" stroke-width="1.5"/><text x="802" y="446" fill="#526176" font-family="ui-monospace, Consolas, monospace" font-size="10" letter-spacing="1.5">STEP</text><text x="802" y="475" fill="#17263D" font-family="system-ui, sans-serif" font-size="18" font-weight="650">Generate</text><text x="802" y="497" fill="#526176" font-family="system-ui, sans-serif" font-size="12">bounded context</text></g>
<g data-node="citations"><rect x="544" y="422" width="200" height="96" rx="8" fill="#FFFEFB" stroke="#C9D0D5" stroke-width="1.5"/><text x="562" y="446" fill="#526176" font-family="ui-monospace, Consolas, monospace" font-size="10" letter-spacing="1.5">STEP</text><text x="562" y="475" fill="#17263D" font-family="system-ui, sans-serif" font-size="18" font-weight="650">Check citations</text><text x="562" y="497" fill="#526176" font-family="system-ui, sans-serif" font-size="12">IDs in retrieved set</text></g>
<g data-node="answer"><rect x="304" y="422" width="200" height="96" rx="8" fill="#E9EFF1" stroke="#C9D0D5" stroke-width="1.5"/><text x="322" y="446" fill="#526176" font-family="ui-monospace, Consolas, monospace" font-size="10" letter-spacing="1.5">DATA</text><text x="322" y="475" fill="#17263D" font-family="system-ui, sans-serif" font-size="18" font-weight="650">Answer + sources</text><text x="322" y="497" fill="#526176" font-family="system-ui, sans-serif" font-size="12">open exact passage</text></g>
<g data-node="abstain"><rect x="1024" y="422" width="200" height="96" rx="8" fill="#E9EFF1" stroke="#C9D0D5" stroke-width="1.5"/><text x="1042" y="446" fill="#526176" font-family="ui-monospace, Consolas, monospace" font-size="10" letter-spacing="1.5">DATA</text><text x="1042" y="475" fill="#17263D" font-family="system-ui, sans-serif" font-size="18" font-weight="650">Abstain</text><text x="1042" y="497" fill="#526176" font-family="system-ui, sans-serif" font-size="12">state the evidence gap</text></g>
<line x1="64" y1="618" x2="1216" y2="618" stroke="#C9D0D5"/>
<text x="64" y="651" fill="#526176" font-family="system-ui, sans-serif" font-size="14">Citation ID validity is structural; semantic claim support is a later evaluation and product feature.</text>
<text x="1216" y="651" text-anchor="end" fill="#A84128" font-family="ui-monospace, Consolas, monospace" font-size="11" letter-spacing="1.2">PROPOSED SYSTEM</text>
</svg>
