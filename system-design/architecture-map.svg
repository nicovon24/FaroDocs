<line class="divider" x1="40" y1="126" x2="1560" y2="126"/>
<text class="eyebrow" x="40" y="158">01 / TOPOLOGÍA</text>
<text class="section" x="40" y="188">Una aplicación, cinco servicios</text>
<text class="muted" x="40" y="209">Next.js presenta la biblioteca; FastAPI posee la lógica; Celery procesa trabajos; PostgreSQL y volúmenes conservan el estado.</text>
<rect class="card" x="40" y="229" width="1520" height="362" rx="8"/>
