<text class="muted" x="421" y="1164">relación documento-etiqueta</text>
<rect class="storage" x="410" y="1183" width="332" height="45" rx="4"/>
<text class="mono" x="421" y="1201">favorites</text>
<text class="muted" x="421" y="1218">favoritos del usuario</text>
<rect class="storage" x="410" y="1237" width="332" height="45" rx="4"/>
<text class="mono" x="421" y="1255">schema_migrations</text>
<text class="muted" x="421" y="1272">migraciones aplicadas</text>
<text class="muted" x="59" y="1334">pgvector habilitado · sin embeddings ni índice de búsqueda en esta etapa</text>
<text class="eyebrow" x="804" y="902">04 / CONTRATO HTTP</text>
<text class="section" x="804" y="932">FastAPI detrás del proxy</text>
<rect class="card" x="804" y="950" width="756" height="405" rx="8"/>
<text class="small-mono" x="822" y="977">NAVEGADOR  /api/library/*   →   FASTAPI</text>
