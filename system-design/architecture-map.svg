<text class="muted" x="822" y="1334">Web health: GET /api/health  ·  métodos proxy: GET / POST / PATCH / DELETE</text>
<text class="eyebrow" x="40" y="1400">05 / LÍMITES VERIFICADOS</text>
<text class="section" x="40" y="1430">Vista local de un solo dueño</text>
<rect class="card" x="40" y="1450" width="1010" height="178" rx="8"/>
<text class="body" x="58" y="1480">• Sin login ni aislamiento multiusuario; web y API publicados solo en 127.0.0.1.</text>
<text class="body" x="58" y="1508">• Carga: 10 MiB; PDF: 100 páginas y 8 MiB de stream descomprimido por página.</text>
<text class="body" x="58" y="1536">• DOCX: 2048 entradas ZIP y 32 MiB expandidos; multipart puede spool antes del límite.</text>
<text class="body" x="58" y="1564">• Sin OCR ni resaltado PDF preciso. Caída del worker en processing requiere futuro watchdog.</text>
<text class="body" x="58" y="1592">• La limpieza local no borra respaldos de base de datos ni la lápida operativa.</text>
<text class="eyebrow" x="1075" y="1400">06 / SIGUIENTES ETAPAS</text>
<text class="section" x="1075" y="1430">Planificadas</text>
<rect class="planned" x="1075" y="1450" width="485" height="178" rx="8"/>
<text class="body" x="1093" y="1480">2  Búsqueda híbrida</text>
<text class="body" x="1093" y="1508">3  Chat con fuentes</text>
<text class="body" x="1093" y="1536">4  Google OIDC + permisos + claves</text>
<text class="body" x="1093" y="1564">5  OCR</text>
<text class="body" x="1093" y="1592">6  Drive  ·  7  Evaluación  ·  8  Demo</text>
