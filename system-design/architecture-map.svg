<text class="node-sub" x="1297" y="510">claves opacas</text>
<text class="small-mono" x="59" y="563">HTTP</text>
<text class="muted" x="305" y="563">El API y el worker comparten código Python y base de datos. El navegador nunca monta el volumen privado.</text>
<text class="small-mono" x="1294" y="563">3 volúmenes persistentes</text>
<text class="eyebrow" x="40" y="628">02 / COMPORTAMIENTO</text>
<text class="section" x="40" y="658">Cuatro recorridos implementados</text>
<rect class="card" x="40" y="676" width="365" height="180" rx="8"/>
<text class="number" x="56" y="700">01</text>
<text class="card-title" x="89" y="701">Carga → pasajes</text>
<line class="divider" x1="56" y1="716" x2="389" y2="716"/>
<text class="body" x="57" y="740">• PDF, DOCX, TXT o Markdown</text>
<text class="body" x="57" y="766">• Validación → original privado</text>
<text class="body" x="57" y="792">• Versión + job → Redis → worker</text>
<text class="body" x="57" y="818">• Bloques con localizador e ID estable</text>
<rect class="card" x="425" y="676" width="365" height="180" rx="8"/>
<text class="number" x="441" y="700">02</text>
<text class="card-title" x="474" y="701">Organización y versiones</text>
<line class="divider" x1="441" y1="716" x2="774" y2="716"/>
<text class="body" x="442" y="740">• Lista y filtros por nombre, carpeta,</text>
<text class="body" x="442" y="766">• etiqueta y favorito</text>
<text class="body" x="442" y="792">• Reemplazo crea versión actual</text>
<text class="body" x="442" y="818">• Versiones anteriores siguen accesibles</text>
<rect class="card" x="810" y="676" width="365" height="180" rx="8"/>
<text class="number" x="826" y="700">03</text>
<text class="card-title" x="859" y="701">Pasaje → fuente</text>
<line class="divider" x1="826" y1="716" x2="1159" y2="716"/>
<text class="body" x="827" y="740">• PDF abre página de la versión</text>
<text class="body" x="827" y="766">• TXT/MD muestran rango de caracteres</text>
<text class="body" x="827" y="792">• DOCX identifica bloque / celda</text>
<text class="body" x="827" y="818">• Texto extraído funciona como respaldo</text>
<rect class="card" x="1195" y="676" width="365" height="180" rx="8"/>
<text class="number" x="1211" y="700">04</text>
<text class="card-title" x="1244" y="701">Borrado → limpieza</text>
<line class="divider" x1="1211" y1="716" x2="1544" y2="716"/>
<text class="body" x="1212" y="740">• Lápida oculta documento al instante</text>
<text class="body" x="1212" y="766">• Job retira originales y pasajes</text>
<text class="body" x="1212" y="792">• Limpia blobs y vínculos</text>
<text class="body" x="1212" y="818">• Fallo de limpieza admite reintento</text>
<text class="eyebrow" x="40" y="902">03 / PERSISTENCIA</text>
<text class="section" x="40" y="932">Doce tablas, una fuente de verdad</text>
<rect class="card" x="40" y="950" width="742" height="405" rx="8"/>
<rect class="storage" x="59" y="967" width="332" height="45" rx="4"/>
