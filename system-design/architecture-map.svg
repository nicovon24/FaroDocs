<text class="muted" x="421" y="1002">extract / delete + intentos</text>
<rect class="storage" x="410" y="1021" width="332" height="45" rx="4"/>
<text class="mono" x="421" y="1039">chunks</text>
<text class="muted" x="421" y="1056">pasajes + localizadores</text>
