<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="ingestion-title ingestion-desc" id="ingestion-root">
<title id="ingestion-title">A file becomes located evidence</title>
<desc id="ingestion-desc">Proposed ingestion flow: upload, validation, private original storage, queued job, extraction or OCR, location-aware chunks, embeddings, and PostgreSQL persistence. Processing states and failures are visible.</desc>
<defs>
<marker id="ingestion-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M 0 0 L 10 4 L 0 8" fill="none" stroke="#526176" stroke-width="1.4"/></marker>
<marker id="ingestion-arrow-accent" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M 0 0 L 10 4 L 0 8" fill="none" stroke="#A84128" stroke-width="1.4"/></marker>
</defs>
<rect x="0" y="0" width="1280" height="720" fill="#F7F3EA"/>
<text x="64" y="51" fill="#A84128" font-family="ui-monospace, Consolas, monospace" font-size="12" letter-spacing="2">FARODOCS / 02 / INGESTION</text>
<text x="64" y="97" fill="#17263D" font-family="Georgia, serif" font-size="38">A file becomes located evidence</text>
<text x="64" y="128" fill="#526176" font-family="system-ui, sans-serif" font-size="15">Versioned originals and extraction recipes keep passages traceable after reprocessing.</text>
<line x1="64" y1="151" x2="1216" y2="151" stroke="#C9D0D5"/>
<path d="M 264 254 L 304 254" fill="none" stroke="#526176" stroke-width="2" marker-end="url(#ingestion-arrow)"/>
<path d="M 504 254 L 544 254" fill="none" stroke="#A84128" stroke-width="2" marker-end="url(#ingestion-arrow-accent)"/>
<path d="M 744 254 L 784 254" fill="none" stroke="#526176" stroke-width="2" marker-end="url(#ingestion-arrow)"/>
<path d="M 884 302 L 884 422" fill="none" stroke="#526176" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ingestion-arrow)"/>
<path d="M 784 470 L 744 470" fill="none" stroke="#526176" stroke-width="2" marker-end="url(#ingestion-arrow)"/>
<path d="M 544 470 L 504 470" fill="none" stroke="#526176" stroke-width="2" marker-end="url(#ingestion-arrow)"/>
<path d="M 304 470 L 264 470" fill="none" stroke="#526176" stroke-width="2" marker-end="url(#ingestion-arrow)"/>
<g data-node="upload"><rect x="64" y="206" width="200" height="96" rx="8" fill="#FFFEFB" stroke="#C9D0D5" stroke-width="1.5"/><text x="82" y="230" fill="#526176" font-family="ui-monospace, Consolas, monospace" font-size="10" letter-spacing="1.5">STEP</text><text x="82" y="259" fill="#17263D" font-family="system-ui, sans-serif" font-size="18" font-weight="650">Upload</text><text x="82" y="281" fill="#526176" font-family="system-ui, sans-serif" font-size="12">PDF · DOCX · TXT · MD</text></g>
<g data-node="validate"><rect x="304" y="206" width="200" height="96" rx="8" fill="#F3DFD6" stroke="#A84128" stroke-width="1.5"/><text x="322" y="230" fill="#526176" font-family="ui-monospace, Consolas, monospace" font-size="10" letter-spacing="1.5">PROCESS</text><text x="322" y="259" fill="#17263D" font-family="system-ui, sans-serif" font-size="18" font-weight="650">Validate</text><text x="322" y="281" fill="#526176" font-family="system-ui, sans-serif" font-size="12">type + limits</text></g>
<g data-node="original"><rect x="544" y="206" width="200" height="96" rx="8" fill="#E9EFF1" stroke="#C9D0D5" stroke-width="1.5"/><text x="562" y="230" fill="#526176" font-family="ui-monospace, Consolas, monospace" font-size="10" letter-spacing="1.5">DATA</text><text x="562" y="259" fill="#17263D" font-family="system-ui, sans-serif" font-size="18" font-weight="650">Original</text><text x="562" y="281" fill="#526176" font-family="system-ui, sans-serif" font-size="12">immutable version</text></g>
<g data-node="queue"><rect x="784" y="206" width="200" height="96" rx="8" fill="#FFFEFB" stroke="#C9D0D5" stroke-width="1.5"/><text x="802" y="230" fill="#526176" font-family="ui-monospace, Consolas, monospace" font-size="10" letter-spacing="1.5">STEP</text><text x="802" y="259" fill="#17263D" font-family="system-ui, sans-serif" font-size="18" font-weight="650">Queue job</text><text x="802" y="281" fill="#526176" font-family="system-ui, sans-serif" font-size="12">visible state + retry</text></g>
<g data-node="extract"><rect x="784" y="422" width="200" height="96" rx="8" fill="#FFFEFB" stroke="#C9D0D5" stroke-width="1.5"/><text x="802" y="446" fill="#526176" font-family="ui-monospace, Consolas, monospace" font-size="10" letter-spacing="1.5">STEP</text><text x="802" y="475" fill="#17263D" font-family="system-ui, sans-serif" font-size="18" font-weight="650">Extract / OCR</text><text x="802" y="497" fill="#526176" font-family="system-ui, sans-serif" font-size="12">ordered source blocks</text></g>
<g data-node="chunks"><rect x="544" y="422" width="200" height="96" rx="8" fill="#FFFEFB" stroke="#C9D0D5" stroke-width="1.5"/><text x="562" y="446" fill="#526176" font-family="ui-monospace, Consolas, monospace" font-size="10" letter-spacing="1.5">STEP</text><text x="562" y="475" fill="#17263D" font-family="system-ui, sans-serif" font-size="18" font-weight="650">Chunk + locate</text><text x="562" y="497" fill="#526176" font-family="system-ui, sans-serif" font-size="12">stable ID · page/offset</text></g>
<g data-node="embed"><rect x="304" y="422" width="200" height="96" rx="8" fill="#FFFEFB" stroke="#C9D0D5" stroke-width="1.5"/><text x="322" y="446" fill="#526176" font-family="ui-monospace, Consolas, monospace" font-size="10" letter-spacing="1.5">STEP</text><text x="322" y="475" fill="#17263D" font-family="system-ui, sans-serif" font-size="18" font-weight="650">Embed</text><text x="322" y="497" fill="#526176" font-family="system-ui, sans-serif" font-size="12">model + recipe ID</text></g>
<g data-node="persist"><rect x="64" y="422" width="200" height="96" rx="8" fill="#E9EFF1" stroke="#C9D0D5" stroke-width="1.5"/><text x="82" y="446" fill="#526176" font-family="ui-monospace, Consolas, monospace" font-size="10" letter-spacing="1.5">DATA</text><text x="82" y="475" fill="#17263D" font-family="system-ui, sans-serif" font-size="18" font-weight="650">Persist</text><text x="82" y="497" fill="#526176" font-family="system-ui, sans-serif" font-size="12">text + vector index</text></g>
<line x1="64" y1="618" x2="1216" y2="618" stroke="#C9D0D5"/>
<text x="64" y="651" fill="#526176" font-family="system-ui, sans-serif" font-size="14">PDF page coordinates are used only when extraction can support them; text fallback remains available.</text>
<text x="1216" y="651" text-anchor="end" fill="#A84128" font-family="ui-monospace, Consolas, monospace" font-size="11" letter-spacing="1.2">PROPOSED SYSTEM</text>
</svg>
